[tool:pytest]
# Pytest configuration for ComfyUI AI GameDev nodes

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Ignore external submodules and their test files
norecursedirs = external/* .git .pytest_cache __pycache__ *.egg-info

# Output formatting
addopts = -v --tb=short --strict-markers

# Custom markers
markers =
    unit: Unit tests with mocked dependencies
    integration: Integration tests requiring external services
    visual: Visual verification tests that save files to disk
    ai: AI-powered verification tests
    slow: Tests that take longer than 5 seconds